name: Nightly snapshot

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC nightly — fast delta
    - cron: "0 3 * * 0"   # 03:00 UTC Sundays — full baseline
  workflow_dispatch:
    inputs:
      mode:
        description: "full (enumerate everything) or nightly (delta over corpus)"
        required: false
        default: "nightly"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run stats tests
        run: python3 scraper/test_stats.py

      - name: Scrape and build snapshot
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Scheduled Sunday 03:00 + manual "full" => full baseline; else nightly delta
          if [ "$EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" = "7" ] || [ "$INPUT_MODE" = "full" ]; then
            python3 scraper/scrape.py --out site/data/snapshot.json --workers 2
          else
            # first run has no corpus: fall back to full automatically
            if [ -f site/data/ships.ndjson ]; then
              python3 scraper/scrape.py --nightly --out site/data/snapshot.json --workers 2
            else
              python3 scraper/scrape.py --out site/data/snapshot.json --workers 2
            fi
          fi

      - name: Upload full corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: ships-ndjson
          path: site/data/ships.ndjson
          retention-days: 30

      - name: Commit updated snapshot + corpus
        run: |
          git config user.name "queue-bot"
          git config user.email "actions@github.com"
          git add site/data/snapshot.json site/data/ships.ndjson
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "nightly snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
