name: Nightly snapshot

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC nightly — fast delta
    - cron: "0 3 * * 0"   # 03:00 UTC Sundays — full baseline
  push:
    branches: [main]
    paths:
      - "site/**"             # UI-only change: skip the scrape, just redeploy
      - ".github/workflows/scrape.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "full (enumerate everything) or nightly (delta over corpus)"
        required: false
        default: "nightly"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run stats tests
        run: python3 scraper/test_stats.py

      - name: Scrape and build snapshot
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Scheduled Sunday 03:00 + manual "full" => full baseline; else nightly delta
          if [ "$EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" = "7" ] || [ "$INPUT_MODE" = "full" ]; then
            python3 scraper/scrape.py --out site/data/snapshot.json --workers 2
          else
            # first run has no corpus: fall back to full automatically
            if [ -f site/data/ships.ndjson ]; then
              python3 scraper/scrape.py --nightly --out site/data/snapshot.json --workers 2
            else
              python3 scraper/scrape.py --out site/data/snapshot.json --workers 2
            fi
          fi

      - name: Upload full corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: ships-ndjson
          path: site/data/ships.ndjson
          retention-days: 30

      - name: Commit updated snapshot + corpus
        run: |
          git config user.name "queue-bot"
          git config user.email "actions@github.com"
          git add site/data/snapshot.json site/data/ships.ndjson site/data/project_meta.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "nightly snapshot $(date -u +%Y-%m-%d)"
            # A manual push or another run may land meanwhile. Rebase; if the
            # generated data files conflict, the FRESH run data wins (it is
            # newer than whatever the remote got), then continue and retry.
            DATA="site/data/snapshot.json site/data/ships.ndjson site/data/project_meta.json"
            for i in 1 2 3; do
              if git push; then break; fi
              git fetch origin main
              if git rebase origin/main; then
                git push && break
              fi
              git checkout --theirs $DATA
              git add $DATA
              GIT_EDITOR=true git rebase --continue
              git push && break
            done
          fi

  deploy:
    needs: scrape
    # a push that only touches site/** skips the scrape job and deploys the
    # committed data straight away, so UI fixes ship in ~1 minute
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
